[package]
name = "sagegui"
version = "0.7.0-alpha.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
eframe = "0.31.0"
egui = "0.31.0"
egui_extras = { version = "0.31.1", features = ["all_loaders"] }

rfd = "0.15.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sage-core = { git = "https://github.com/jspaezp/sage.git", rev = "9271e28d7e39c528edbb31f6199cc42228c337a8" }
sage-cli = { git = "https://github.com/jspaezp/sage.git", rev = "9271e28d7e39c528edbb31f6199cc42228c337a8" }
sage-cloudpath = { git = "https://github.com/jspaezp/sage.git", rev = "9271e28d7e39c528edbb31f6199cc42228c337a8" }

timsrust = "0.4.2"
num_cpus = "1.13"
image = { version = "0.25", features = ["png"] }

env_logger = "0.11.5"
mimalloc = { version = "*", features = ["secure"] }

[profile.release]
lto = "thin"
codegen-units = 1
