[package]
name = "sagegui"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
eframe = "0.29.0"
egui = "0.29.0"
egui_extras = { version = "0.29.1", features = ["all_loaders"] }

rfd = "0.15.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sage-core = { git = "https://github.com/jspaezp/sage.git", rev = "6e5239613b0ec0f096ea395c0e80be6d345f11da" }
sage-cli = { git = "https://github.com/jspaezp/sage.git", rev = "6e5239613b0ec0f096ea395c0e80be6d345f11da" }
sage-cloudpath = { git = "https://github.com/jspaezp/sage.git", rev = "6e5239613b0ec0f096ea395c0e80be6d345f11da" }

timsrust = "0.4.2"
num_cpus = "1.13"
image = { version = "0.24", features = ["png"] }

env_logger = "0.11.5"

[profile.release]
lto = "thin"
codegen-units = 1
